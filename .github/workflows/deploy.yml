name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ilova kodini olish
        uses: actions/checkout@v4
        with:
          # Har bir .md sahifasining "yangilangan" sanasi commit tarixidan olinadi
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Linux trenajori (~95 MB) git'da saqlanmaydi: Debian paketlaridan shu yerda yig'iladi (~6 daqiqa).
      # Yig'ish skriptlari o'zgarmasa — keshdan olinadi.
      - name: Linux trenajori keshi
        id: linux-trenajor
        uses: actions/cache@v4
        with:
          path: linux-trenajor/build/web
          key: linux-trenajor-${{ hashFiles('linux-trenajor/scripts/**', 'public/trenajor/v86.wasm', 'package-lock.json') }}

      - name: Linux trenajorini yig'ish
        if: steps.linux-trenajor.outputs.cache-hit != 'true'
        run: sh linux-trenajor/scripts/yigish.sh

      - name: Linux trenajorini saytga qo'shish
        run: rm -rf public/linux-trenajor && cp -r linux-trenajor/build/web public/linux-trenajor

      # Nginx trenajori: Linux trenajori quvurining "nginx" profili (linux-trenajor/scripts, TRENAJOR_PROFIL=nginx).
      # nginx 1.31.8 i386 uchun Docker'da (debian:bookworm, linux/386) nginx.org manba arxividan yig'iladi.
      - name: Nginx trenajori keshi
        id: nginx-trenajor
        uses: actions/cache@v4
        with:
          path: nginx-trenajor/build/web
          key: nginx-trenajor-${{ hashFiles('nginx-trenajor/**', 'linux-trenajor/scripts/**', 'public/trenajor/v86.wasm', 'package-lock.json') }}

      - name: Nginx trenajorini yig'ish
        if: steps.nginx-trenajor.outputs.cache-hit != 'true'
        run: |
          sh nginx-trenajor/scripts/nginx-yigish.sh
          TRENAJOR_PROFIL=nginx sh linux-trenajor/scripts/yigish.sh

      - name: Nginx trenajorini saytga qo'shish
        run: rm -rf public/nginx-trenajor && cp -r nginx-trenajor/build/web public/nginx-trenajor

      # RabbitMQ trenajori: Linux trenajori quvurining "rabbitmq" profili. Erlang/OTP 28 i386 uchun Docker'da
      # (debian:bookworm, linux/386) erlang/otp manba arxividan yig'iladi; RabbitMQ 4.4.0 — rasmiy generic UNIX
      # arxivi (GPG imzosi tekshiriladi). Holat surati RabbitMQ ishlab turgan paytda olinadi (profil.json: holatKutish).
      - name: RabbitMQ trenajori keshi
        id: rabbitmq-trenajor
        uses: actions/cache@v4
        with:
          path: rabbitmq-trenajor/build/web
          key: rabbitmq-trenajor-${{ hashFiles('rabbitmq-trenajor/**', 'linux-trenajor/scripts/**', 'public/trenajor/v86.wasm', 'package-lock.json') }}

      - name: RabbitMQ trenajorini yig'ish
        if: steps.rabbitmq-trenajor.outputs.cache-hit != 'true'
        run: |
          sh rabbitmq-trenajor/scripts/erlang-yigish.sh
          sh rabbitmq-trenajor/scripts/rabbitmq-arxiv.sh
          TRENAJOR_PROFIL=rabbitmq sh linux-trenajor/scripts/yigish.sh

      - name: RabbitMQ trenajorini saytga qo'shish
        run: rm -rf public/rabbitmq-trenajor && cp -r rabbitmq-trenajor/build/web public/rabbitmq-trenajor

      # Redis trenajori: Linux trenajori quvurining "redis" profili. Redis 8.10.3 i386 uchun Docker'da (debian:bookworm,
      # linux/386) rasmiy manba arxividan yig'iladi (SHA256 — redis-hashes). Holat surati Redis va boshqaruv xizmati
      # ishlab turgan paytda olinadi (profil.json: holatKutish).
      - name: Redis trenajori keshi
        id: redis-trenajor
        uses: actions/cache@v4
        with:
          path: redis-trenajor/build/web
          key: redis-trenajor-${{ hashFiles('redis-trenajor/**', 'linux-trenajor/scripts/**', 'public/trenajor/v86.wasm', 'package-lock.json') }}

      - name: Redis trenajorini yig'ish
        if: steps.redis-trenajor.outputs.cache-hit != 'true'
        run: |
          sh redis-trenajor/scripts/redis-yigish.sh
          TRENAJOR_PROFIL=redis sh linux-trenajor/scripts/yigish.sh

      - name: Redis trenajorini saytga qo'shish
        run: rm -rf public/redis-trenajor && cp -r redis-trenajor/build/web public/redis-trenajor

      # Video darslar (~1.4 GB) saytga qo'shilmaydi: ular VPS'dan beriladi (https://kamgapir.uz/video/,
      # VPS repodan faqat public/video ni sparse checkout qilib, har 15 daqiqada yangilaydi — docs/ish-holati.md).
      - name: Videolarni artifact'dan chiqarish
        run: rm -rf public/video

      - name: Build
        env:
          VITE_VIDEO_BASE_URL: https://kamgapir.uz/video/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Settings → Secrets and variables → Actions → Variables (ochiq kalitlar, secret emas)
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS }}
        run: npm run build

      - name: SPA uchun 404.html
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Sayt ~1.7 GB (Linux va nginx trenajorlari): fayllarni sinxronlash standart 10 daqiqadan oshib ketdi
          timeout: 1800000
