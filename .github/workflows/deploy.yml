name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Kontent repo'si o'zgarganda tashqaridan ishga tushirish uchun
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ilova kodini olish
        uses: actions/checkout@v4

      - name: Qo'llanma kontentini olish
        uses: actions/checkout@v4
        with:
          repository: mfs1011/laravel-api-book
          path: content-repo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          DOCS_SOURCE: ../content-repo/docs
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA uchun 404.html
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
