<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ovozlash holati</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3df;
    --accent: #2f6fde; --ok: #1f8a4c; --work: #c77700; --queue: #9a9a93; --bar: #e9e8e4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1d1d1b; --text: #ecebe6; --muted: #a09f98; --line: #2e2d2a;
      --accent: #7aa7ff; --ok: #4cc283; --work: #f0a63c; --queue: #77766f; --bar: #2a2926; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 140px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--bar); border-radius: 99px; overflow: hidden; margin: 10px 0; }
  .bar > span { display: block; height: 100%; background: var(--ok); }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; }
  .now { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; display: none; }
  .now.on { display: block; }
  .now .head { display: flex; justify-content: space-between; gap: 10px; color: var(--work); }
  .now .head b { font-variant-numeric: tabular-nums; }
  .now .bar > span { background: var(--work); transition: width .8s ease; }
  .now .eta { color: var(--muted); }
  .finish { margin-top: 6px; font-size: 14px; }
  .finish b { font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent); flex: none; }
  li .pc { color: var(--work); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  summary { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  .book { font-weight: 600; flex: 1; min-width: 0; }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .mini { width: 70px; height: 5px; background: var(--bar); border-radius: 99px; overflow: hidden; flex: none; }
  .mini > span { display: block; height: 100%; background: var(--ok); }
  ul { list-style: none; margin: 0; padding: 0 0 6px; border-top: 1px solid var(--line); }
  li { display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 34px; font-size: 14px; }
  li + li { border-top: 1px solid var(--line); }
  li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .m { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--queue); }
  .tayyor .dot { background: var(--ok); }
  .ishlanmoqda .dot { background: var(--work); animation: pulse 1.2s infinite; }
  .charon .dot { background: var(--accent); }
  .navbatda .t { color: var(--muted); }
  @keyframes pulse { 50% { opacity: .3; } }
  button.play { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 7px;
    padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; flex: none; }
  button.play:hover { border-color: var(--accent); color: var(--accent); }
  .player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: none; }
  .player.on { display: block; }
  .player .in { max-width: 860px; margin: 0 auto; }
  .player .name { font-size: 13px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  audio { width: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .credit { color: var(--muted); font-size: 12px; margin-top: 24px; }
  .credit a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Ovozlash holati</h1>
  <div class="sub">dev-docs boblari · Gapiring (Oracle server) · <span id="upd">yuklanmoqda…</span></div>

  <div class="summary">
    <div class="big" id="pct">—</div>
    <div class="bar"><span id="bar" style="width:0"></span></div>
    <div class="stats" id="stats"></div>
    <div class="finish" id="finish"></div>
    <div class="now" id="now">
      <div class="head"><span id="nowName"></span><b id="nowPct">0%</b></div>
      <div class="bar"><span id="nowBar" style="width:0"></span></div>
      <div class="eta" id="nowEta"></div>
    </div>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:var(--ok)"></i>tayyor</span>
    <span><i class="dot" style="background:var(--work)"></i>ishlanmoqda</span>
    <span><i class="dot" style="background:var(--queue)"></i>navbatda</span>
    <span><i class="dot" style="background:var(--accent)"></i>eski ovoz (Gemini, Charon)</span>
  </div>

  <div id="tree"></div>

  <p class="credit">Ovoz: <a href="https://gapi.uz" target="_blank" rel="noopener">Gapiring by Gapi</a>
    (<a href="https://huggingface.co/kyutai/pocket-tts" target="_blank" rel="noopener">Kyutai Pocket TTS</a> asosida),
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></p>
</main>

<div class="player" id="player">
  <div class="in"><div class="name" id="pname"></div><audio id="audio" controls preload="none"></audio></div>
</div>

<script>
const fmtTime = (s) => { s = Math.round(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const fmtHours = (h) => h >= 48 ? `~${Math.round(h / 24)} kun` : `~${Math.round(h)} soat`;
const fmtClock = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const OYLAR = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
const fmtDate = (iso) => { const d = new Date(iso); return `${d.getDate()}-${OYLAR[d.getMonth()]}, ${d.getFullYear()}`; };
let shownPct = 0, oldBase = '', titles = {}, rate = 3;
function countTo(el, target, suffix) {
  const from = shownPct, t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / 900), v = from + (target - from) * (1 - Math.pow(1 - k, 3));
    el.textContent = `${v.toFixed(1)}%${suffix}`;
    if (k < 1) requestAnimationFrame(step); else shownPct = target;
  };
  requestAnimationFrame(step);
}
const open = new Set(JSON.parse(sessionStorage.getItem('ochiq') || '[]'));
let playing = null;

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render(d) {
  const all = d.kitoblar.flatMap((k) => k.boblar).filter((c) => c.holat !== 'charon');
  const ready = all.filter((c) => c.holat === 'tayyor');
  const pct = all.length ? (ready.length / all.length) * 100 : 0;
  countTo(document.getElementById('pct'), pct, ` · ${ready.length} / ${all.length} bob`);
  oldBase = d.eski_ovoz_url || '';
  rate = d.s_per_word || rate;
  titles = Object.fromEntries(d.kitoblar.flatMap((k) => k.boblar).map((c) => [c.file, c.title]));
  document.getElementById('finish').innerHTML = d.tugash && ready.length < all.length
    ? `Taxminiy tugash: <b>${fmtDate(d.tugash)}</b> (${fmtHours(d.qolgan_soat)} qoldi)` : (all.length ? '<b>Hammasi tayyor</b>' : '');
  document.getElementById('bar').style.width = `${pct}%`;
  const audioSec = ready.reduce((a, c) => a + (c.seconds || 0), 0);
  document.getElementById('stats').innerHTML = [
    `Tayyor audio: ${fmtTime(audioSec)}`,
    `Tezlik: ${d.s_per_word} s/so'z`,
    `Qolgan vaqt: ${fmtHours(d.qolgan_soat)}`,
  ].map((x) => `<span>${x}</span>`).join('');
  renderNow(d.hozir);
  document.getElementById('upd').textContent = `yangilandi ${new Date(d.yangilandi).toLocaleString()}`;

  document.getElementById('tree').innerHTML = d.kitoblar.map((k) => {
    const own = k.boblar.filter((c) => c.holat !== 'charon');
    const done = own.filter((c) => c.holat === 'tayyor').length;
    const isCharon = own.length === 0;
    const old = k.boblar.filter((c) => c.eski).length;
    const label = isCharon ? `${old} / ${k.boblar.length} · eski ovoz` : `${done} / ${own.length}`;
    const p = isCharon ? 100 : (done / own.length) * 100;
    return `<details data-k="${esc(k.id)}" ${open.has(k.id) ? 'open' : ''}>
      <summary><span class="book">${esc(k.id)}</span><span class="mini"><span style="width:${p}%${isCharon ? ';background:var(--accent)' : ''}"></span></span><span class="count">${label}</span></summary>
      <ul>${k.boblar.map((c) => `<li class="${c.holat}" data-f="${esc(c.file)}"><i class="dot"></i><span class="t" title="${esc(c.file)}">${esc(c.title)}</span>
        ${c.holat === 'ishlanmoqda' ? '<span class="pc"></span>' : ''}
        ${c.eski ? '<span class="tag">eski · Gemini</span>' : ''}
        <span class="m">${c.holat === 'tayyor' ? fmtTime(c.seconds) : `${c.words} so'z`}</span>
        ${c.holat === 'tayyor' ? `<button class="play" data-u="Gapiring/${esc(c.file)}.ogg" data-n="${esc(c.title)}">▶ tinglash</button>` : ''}
        ${c.eski ? `<button class="play" data-u="${esc(oldBase + c.file)}.ogg" data-n="${esc(c.title)} — eski (Gemini, Charon)">▶ eski</button>` : ''}</li>`).join('')}</ul>
    </details>`;
  }).join('');
}

document.getElementById('tree').addEventListener('toggle', (e) => {
  const k = e.target.dataset?.k; if (!k) return;
  e.target.open ? open.add(k) : open.delete(k);
  try { sessionStorage.setItem('ochiq', JSON.stringify([...open])); } catch {}
}, true);

document.getElementById('tree').addEventListener('click', (e) => {
  const b = e.target.closest('button.play'); if (!b) return;
  const audio = document.getElementById('audio');
  if (playing !== b.dataset.u) { audio.src = b.dataset.u; playing = b.dataset.u; }
  document.getElementById('pname').textContent = b.dataset.n;
  document.getElementById('player').classList.add('on');
  audio.play();
});

function renderNow(h) {
  const box = document.getElementById('now');
  if (!h) { box.classList.remove('on'); return; }
  box.classList.add('on');
  // Progress yozilmagan bo'lsa (eski jarayon) — o'tgan vaqt va o'rtacha tezlikdan taxmin
  let frac = h.progress, finish = h.tugash;
  if (!frac) {
    const total = h.words * rate * 1000, began = new Date(h.boshlandi).getTime();
    frac = Math.min(0.99, (Date.now() - began) / total);
    finish = new Date(began + total).toISOString();
  }
  h = { ...h, tugash: finish };
  const p = Math.round(frac * 1000) / 10;
  document.getElementById('nowName').textContent = `Hozir: ${titles[h.file] || h.file} (${h.words} so'z)`;
  document.getElementById('nowPct').textContent = `${p.toFixed(1)}%`;
  document.getElementById('nowBar').style.width = `${p}%`;
  document.getElementById('nowEta').textContent = h.tugash
    ? `${fmtClock(h.boshlandi)} da boshlandi · taxminan ${fmtClock(h.tugash)} da tugaydi`
    : `${fmtClock(h.boshlandi)} da boshlandi · tugash vaqti hisoblanmoqda…`;
  const li = document.querySelector(`li[data-f="${CSS.escape(h.file)}"] .pc`);
  if (li) li.textContent = `${p.toFixed(0)}%`;
}

async function loadNow() {
  try {
    const r = await fetch(`Gapiring/_hozir.json?${Date.now()}`);
    renderNow(r.ok ? await r.json() : null);
  } catch {}
}

async function load() {
  try {
    const r = await fetch(`Gapiring/holat.json?${Date.now()}`);
    if (r.ok) render(await r.json());
  } catch {}
}
load().then(loadNow);
setInterval(load, 30000);
setInterval(loadNow, 10000);
</script>
</body>
</html>
