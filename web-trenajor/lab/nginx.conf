# Web asoslari laboratoriyasi — nginx trenajori tasvirida, sahifa ochilganda /etc/nginx/conf.d/ ga yoziladi.
# Har manzil HTTP'ning bitta mavzusini ko'rsatadi; javoblarni nginx'ning o'zi beradi (statik fayl, return, add_header).

# CORS: faqat shu origin'ga ruxsat. Bo'sh qiymatli add_header nginx'da umuman qo'shilmaydi.
map $http_origin $lab_cors {
    default            "";
    "http://sayt.test" $http_origin;
}

server {
    listen      8080;
    server_name api.test sayt.test localhost;
    root        /srv/lab;
    charset     utf-8;

    gzip            on;
    gzip_types      text/plain text/css application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary       on;

    # --- metodlar
    location = /api/foydalanuvchi {
        if ($request_method !~ ^(GET|HEAD)$) {
            add_header Allow "GET, HEAD" always;
            return 405;
        }
        default_type application/json;
        return 200 '{"id": 7, "ism": "Ali", "shahar": "Toshkent"}\n';
    }
    location = /api/buyurtma {
        if ($request_method != POST) {
            add_header Allow "POST" always;
            return 405;
        }
        add_header Location /api/buyurtma/42 always;
        default_type application/json;
        return 201 '{"id": 42, "holat": "yaratildi"}\n';
    }

    # --- holat kodlari
    location = /xato { return 500; }
    location = /band {
        add_header Retry-After 120 always;
        return 503;
    }

    # --- redirectlar
    location = /yangi  { default_type text/plain; return 200 "Bu yangi manzil.\n"; }
    location = /eski   { return 301 /yangi; }
    location = /vaqtincha { return 302 /yangi; }
    location = /zanjir { return 301 /eski; }
    location = /forma-303 { return 303 /yangi; }
    location = /forma-307 { return 307 /api/buyurtma; }

    # --- keshlash: statik fayllarda nginx ETag va Last-Modified'ni o'zi qo'yadi
    location /static/ { expires 1h; }
    location = /yangiliklar {
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "Har safar yangidan so'raladi.\n";
    }

    # --- sekin javob: tana sekundiga 8 KB dan uzatiladi
    location = /sekin.txt { limit_rate 8k; }

    # --- cookie va sessiya
    location = /kirish {
        add_header Set-Cookie "sessiya=s3cr3t42; Path=/; Max-Age=3600; HttpOnly; SameSite=Lax" always;
        default_type application/json;
        return 200 '{"kirdi": true}\n';
    }
    location = /chiqish {
        add_header Set-Cookie "sessiya=; Path=/; Max-Age=0" always;
        default_type application/json;
        return 200 '{"chiqdi": true}\n';
    }
    location = /profil {
        default_type application/json;
        if ($cookie_sessiya != "s3cr3t42") {
            return 401 '{"xato": "avval /kirish"}\n';
        }
        return 200 '{"ism": "Ali", "sessiya": "$cookie_sessiya"}\n';
    }

    # --- Basic autentifikatsiya (login: ali, parol: parol123)
    location /maxfiy/ {
        auth_basic           "Maxfiy hudud";
        auth_basic_user_file /etc/nginx/lab.htpasswd;
    }

    # --- CORS: preflight (OPTIONS) va asosiy so'rov
    location = /api/cors {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $lab_cors always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age       600 always;
            add_header Vary                         Origin always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $lab_cors always;
        add_header Vary                        Origin always;
        default_type application/json;
        return 200 '{"malumot": "boshqa origin uchun"}\n';
    }
}
