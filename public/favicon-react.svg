<svg xmlns="http://www.w3.org/2000/svg" viewBox="-13 -12 26 24">
    <style>
        .react-dot { fill: #0b7fa0; }
        .react-rings { fill: none; stroke: #0b7fa0; stroke-width: 1.1; }
        @media (prefers-color-scheme: dark) {
            .react-dot { fill: #58c4dc; }
            .react-rings { stroke: #58c4dc; }
        }
    </style>
    <circle class="react-dot" cx="0" cy="0" r="2.05"/>
    <g class="react-rings">
        <ellipse rx="11" ry="4.2"/>
        <ellipse rx="11" ry="4.2" transform="rotate(60)"/>
        <ellipse rx="11" ry="4.2" transform="rotate(120)"/>
    </g>
</svg>
