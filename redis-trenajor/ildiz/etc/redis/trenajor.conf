# Redis trenajori: asl redis.conf (Redis 8.10.3 manbasidagi) oxiriga "include" bilan qo'shiladi — shu yerdagisi ustun.
dir /var/lib/redis
# asl qiymat /var/run/redis_6379.pid — redis foydalanuvchisi u yerga yoza olmaydi
pidfile /var/lib/redis/redis.pid
# Sahifadagi sxema kalit hodisalarini (o'chirildi, muddati tugadi, evict …) shu bildirishnomalardan oladi.
# K — __keyspace@0__, E — __keyevent@0__ kanallari, A — barcha hodisa turlari (redis.conf'dagi izohga qarang).
notify-keyspace-events KEA
# VM xotirasi 256 MB — Redis'ga 64 MB. Siyosat standartdagidek: noeviction (xotira to'lsa yozish rad etiladi).
maxmemory 64mb
