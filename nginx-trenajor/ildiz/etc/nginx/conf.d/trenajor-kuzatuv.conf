# Nginx trenajori uchun: sahifadagi "So'rov yo'li" har so'rov qaysi server, upstream va keshdan o'tganini
# shu log'dan oladi. O'chirsangiz, sayt ishlayveradi, faqat sxemada server nomi ko'rinmaydi.
log_format trenajor escape=json '{"c":"$connection","n":"$connection_requests","server":"$server_name",'
    '"port":"$server_port","host":"$host","so":"$request","uri":"$uri","status":"$status",'
    '"upstream":"$upstream_addr","ustatus":"$upstream_status","kesh":"$upstream_cache_status",'
    '"limit":"$limit_req_status","vaqt":"$request_time","ip":"$remote_addr"}';
access_log /run/nginx-kuzatuv/access.log trenajor;
