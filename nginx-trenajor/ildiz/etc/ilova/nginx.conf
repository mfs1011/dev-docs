# "Ilova" — trenajordagi backend: proxy_pass mashqlari uchun 8081–8083 portlarida javob beradi.
# Bu asosiy nginx emas: alohida servis (systemctl status ilova), o'z konfiguratsiyasi va log'i bilan.
pid /run/ilova.pid;
error_log /var/log/ilova-error.log;
events { worker_connections 64; }
http {
    access_log off;
    default_type text/plain;
    server {
        listen 127.0.0.1:8081;
        listen 127.0.0.1:8082;
        listen 127.0.0.1:8083;
        location / {
            return 200 "ilova:$server_port $request_method $request_uri\nHost: $http_host\nX-Real-IP: $http_x_real_ip\nX-Forwarded-For: $http_x_forwarded_for\nX-Forwarded-Proto: $http_x_forwarded_proto\n";
        }
    }
}
