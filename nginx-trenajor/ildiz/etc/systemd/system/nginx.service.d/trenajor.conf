# Nginx trenajori: nginx debug log'ini ham yozadi (--with-debug bilan yig'ilgan).
# Sahifadagi "So'rov yo'li" shu log'dan nginx qaysi location'ni tanlaganini chizadi.
# Bu qo'shimcha log /run da (xotirada) — asl /var/log/nginx/error.log o'zgarmaydi.
[Service]
ExecStartPre=/bin/mkdir -p /run/nginx-kuzatuv
ExecStart=
ExecStart=/usr/sbin/nginx -c ${CONFFILE} -g "error_log /run/nginx-kuzatuv/debug.log debug;"
