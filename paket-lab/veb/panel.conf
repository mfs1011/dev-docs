# HTTP autentifikatsiya darsi: panel.sayt.test — Basic (nginx o'zi tekshiradi). Kontent fayldan: himoyalangan joyda
# `return` ishlatilmaydi — u access bosqichidan oldin ishlaydi va tekshiruvni chetlab o'tadi (Web asoslari, 16-bob).
server {
    listen 80;
    server_name panel.sayt.test;
    root /usr/share/nginx/panel;
    auth_basic           "Boshqaruv paneli";
    auth_basic_user_file /etc/nginx/panel.htpasswd;
}
