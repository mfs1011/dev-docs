# CORS darsi: API boshqa nomda (api.sayt.test) — sahifa (sayt.test) uchun bu boshqa manba (origin).
# Ruxsat faqat http://sayt.test ga, faqat GET va PUT, Content-Type sarlavhasi bilan; tekshiruv natijasi 600 soniya keshlanadi.
server {
    listen 80;
    server_name api.sayt.test;
    default_type application/json;

    location = /narx {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://sayt.test";
            add_header Access-Control-Allow-Methods "GET, PUT";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age 600;
            add_header Vary Origin;
            return 204;
        }
        add_header Access-Control-Allow-Origin "http://sayt.test";
        add_header Vary Origin;
        return 200 '{"narx": 42000}\n';
    }
}
