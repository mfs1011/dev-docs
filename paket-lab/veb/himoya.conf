# CSP va clickjacking darsi: himoya.sayt.test. /csp.html — faqat nonce'li skriptga ruxsat, buzilish hisoboti /hisobot ga;
# /panel.html — boshqa sayt freymiga qo'yilmasin (X-Frame-Options va frame-ancestors). Nonce bu yerda doimiy — faqat
# laboratoriya uchun; haqiqiy saytda u har javobda yangi tasodifiy qiymat bo'lishi shart (Web asoslari, 21-bob).
server {
    listen 80;
    server_name himoya.sayt.test;
    root /usr/share/nginx/himoya;

    location = /csp.html {
        add_header Content-Security-Policy "script-src 'nonce-lab123'; report-uri /hisobot";
    }
    location = /panel.html {
        add_header X-Frame-Options "DENY";
        add_header Content-Security-Policy "frame-ancestors 'none'";
    }
    location = /hisobot {
        return 204;
    }
}
