# Metodlar va holat kodlari darsi: fayl.sayt.test — nginx WebDAV moduli (ngx_http_dav_module) PUT va DELETE ni o'zi bajaradi:
# fayl yaratadi (201), almashtiradi (204), o'chiradi (204). POST — statik faylga ruxsat yo'q (405).
# /tashqi — ishlamayotgan backend'ga proxy (502). Fayllar konteyner ichida, har ishga tushishda bo'sh.
server {
    listen 80;
    server_name fayl.sayt.test;
    root /var/lib/nginx-dav;
    dav_methods PUT DELETE;
    create_full_put_path on;
    client_body_temp_path /var/lib/nginx-dav-tmp;

    location /tashqi {
        proxy_pass http://127.0.0.1:9;
    }
}
