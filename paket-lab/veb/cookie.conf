# Cookie darsi: alohida nom (hisob.sayt.test) — boshqa darslarning sayt.test javoblari o'zgarmaydi.
# /kirish uchta cookie o'rnatadi, /profil server ko'rgan Cookie sarlavhasini qaytaradi, /chiqish sessiyani o'chiradi.
server {
    listen 80;
    server_name hisob.sayt.test;
    default_type text/plain;

    location = /kirish {
        # $request_id — nginx har so'rovga beradigan tasodifiy 32 belgili o'n oltilik son: sessiya identifikatori o'rnida
        add_header Set-Cookie "sessiya=$request_id; Path=/; HttpOnly; SameSite=Lax";
        add_header Set-Cookie "til=uz; Path=/; Max-Age=3600";
        add_header Set-Cookie "panel=ochiq; Path=/admin";
        return 200 "kirdingiz\n";
    }
    location = /profil {
        return 200 "server ko'rgan Cookie: $http_cookie\n";
    }
    location = /chiqish {
        add_header Set-Cookie "sessiya=; Path=/; Max-Age=0";
        return 200 "chiqdingiz\n";
    }
}
