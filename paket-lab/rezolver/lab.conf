# Laboratoriya rezolveri. Debian'ning standart sozlamalari (ishonch langari va h.k.) ishlatilmaydi.
server:
  interface: 192.168.1.53
  access-control: 192.168.1.0/24 allow
  do-ip6: no
  # Ildiz serverlar ro'yxati — haqiqiy root emas, laboratoriya ildizi
  root-hints: /etc/unbound/ildiz.hints
  # Laboratoriya zonalari imzolanmagan: DNSSEC tekshiruvi yo'q, faqat iterativ qidiruv
  module-config: "iterator"
  # ".test" — RFC 6761 maxsus nomi: Unbound uni sukut bo'yicha o'zi NXDOMAIN bilan yopadi.
  # Laboratoriya domeni shu yerda, shuning uchun bu blok o'chiriladi.
  local-zone: "test." nodefault
  chroot: ""
  username: ""
  hide-identity: yes
  hide-version: yes
  verbosity: 1
