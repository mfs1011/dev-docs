# nginx: sayt.test HTTPS (faqat TLS 1.3). veb konteynerida /etc/nginx/tls/ ga ulanadi.
server {
    listen 443 ssl;
    # HTTP/3 darsi: o'sha 443-port, lekin UDP (QUIC). TCP orqali so'raydigan darslar o'zgarmaydi
    listen 443 quic reuseport;
    # HTTP/2 darsi: ALPN'da h2 taklif qilinadi; --http1.1 bilan so'ragan darslar (tls) o'zgarmaydi
    http2 on;
    server_name sayt.test;
    ssl_certificate     /etc/nginx/tls/zanjir.pem;
    ssl_certificate_key /etc/nginx/tls/sayt.key;
    # TLS 1.2 faqat HTTPS darsidagi solishtirish uchun; boshqa darslar curl --tlsv1.3 bilan so'raydi va 1.3 kelishadi
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;

    # CSRF darsi: kirish ikki cookie beradi (Lax va None), keyin sahifa o'z saytidan POST qiladi va boshqa saytga o'tadi;
    # /csrf/otkazma server ko'rgan Cookie va Sec-Fetch-Site ni qaytaradi (haqiqiy o'tkazma yo'q — faqat ko'rsatish)
    location = /csrf/kirish {
        default_type text/html;
        add_header Set-Cookie "sid_lax=lax1; SameSite=Lax; Secure; HttpOnly; Path=/";
        add_header Set-Cookie "sid_none=none1; SameSite=None; Secure; HttpOnly; Path=/";
        return 200 '<!doctype html><meta charset="utf-8"><title>kirdingiz</title><script>fetch("/csrf/otkazma",{method:"POST",body:"summa=100"}).then(()=>{location="http://yomon.test/hujum.html"})</script>';
    }
    location = /csrf/otkazma {
        default_type text/plain;
        return 200 "server korgan Cookie: [$http_cookie] Sec-Fetch-Site: [$http_sec_fetch_site]\n";
    }

    # MITM darsi: o'sha login formasi HTTPS orqali; HSTS faqat HTTPS javobida ma'noli (RFC 6797, 7.2)
    location = /kirish {
        default_type text/plain;
        add_header Strict-Transport-Security "max-age=31536000";
        return 200 "kirdingiz\n";
    }
}

# Redirect darsi: eski manzil (http, www) → yagona manzil https://sayt.test (bitta 301 bilan).
# Faqat www.sayt.test nomida — boshqa darslar (sayt.test, IP) bunga tushmaydi.
server {
    listen 80;
    server_name www.sayt.test;
    return 301 https://sayt.test$request_uri;
}
